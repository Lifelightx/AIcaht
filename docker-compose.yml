services:
  nginx:
    image: nginx:alpine
    container_name: chatapp_nginx
    ports:
      - "80:80"
      - "8055:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
        - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatapp"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatapp_backend
    image: chat-app-backend
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      # 🌟 FIX 2: Ensure your backend knows to talk to the 'postgres' service container name, not 'localhost'
      - DATABASE_URL=postgresql+asyncpg://admin:admin123@postgres:5432/chatapp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      # 🌟 FIX 3: Tell Docker to wait for the healthcheck to pass, not just the container to start
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chat-app-frontend
    container_name: chatapp_frontend
    environment:
      - VITE_API_URL=/api    
    restart: unless-stopped

volumes:
  postgres_data:
