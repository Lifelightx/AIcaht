version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatapp_backend
    ports:
      - "5000:5000"
    environment:
      # Optional: To connect to Ollama running on your host machine
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatapp_frontend
    ports:
      - "80:80"
      - "8080:80" # Exposed on port 80 and 8080
    depends_on:
      - backend
    restart: unless-stopped
