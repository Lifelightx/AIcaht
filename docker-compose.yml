version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: chatapp_nginx
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: chatapp

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatapp_backend
    # Removed ports mapping as Nginx handles proxying; backend is accessible via Nginx port 80
    environment:
      # Optional: To connect to Ollama running on your host machine
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ./backend:/app
      
      

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatapp_frontend
    environment:
      # Use /api as base URL for the frontend since Nginx handles proxying to the backend
      - VITE_API_URL=/api
    ports:
      # Optional: you requested frontend should run in 5173
      - "5173:5173"
    volumes:
      # Map your local code to inside the container for hot reloading (optional but highly recommended for dev servers)
      - ./frontend:/app
      # Exclude node_modules so docker uses its internally installed modules
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data: